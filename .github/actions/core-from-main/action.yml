name: Core from main
description: >-
  Toad tracks sibling branches declared in pyproject.toml. This refreshes those sources,
  syncs the environment from that lock, and checks Core out at the commit the lock
  resolved, so one run has one answer to which Core it runs.
inputs:
  path:
    description: Where to check Core out
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python -m pip install uv==0.12.0
    - id: core
      shell: bash
      run: |
        python - <<'PY'
        import os, pathlib, subprocess, tomllib
        sources = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['tool']['uv']['sources']
        updates = [argument for name, source in sources.items() if 'branch' in source
                   for argument in ('--upgrade-package', name)]
        subprocess.run(['uv', 'lock', *updates], check=True)
        subprocess.run(['uv', 'sync', '--locked', '--all-extras', '--no-editable'], check=True)
        package, = (p for p in tomllib.loads(pathlib.Path('uv.lock').read_text())['package']
                    if p['name'] == 'agent-comms')
        url, commit = package['source']['git'].split('#')
        repository = url.split('?')[0].removeprefix('https://github.com/').removesuffix('.git')
        print(f'Core resolved from main: {repository}@{commit}')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            print(f'repository={repository}', file=output)
            print(f'commit={commit}', file=output)
        PY
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.core.outputs.repository }}
        ref: ${{ steps.core.outputs.commit }}
        path: ${{ inputs.path }}
        submodules: recursive
