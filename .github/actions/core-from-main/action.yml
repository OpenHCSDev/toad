name: Core from main
description: >-
  Refresh Core from its declared branch while preserving the candidate's locked
  sibling dependencies. Sync that environment and check Core out at the resolved
  commit, so verification does not silently replace a paired dependency candidate.
inputs:
  path:
    description: Where to check Core out
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python -m pip install uv==0.12.0
    - id: core
      shell: bash
      run: |
        python - <<'PY'
        import os, pathlib, subprocess, sys, tomllib
        package_name = 'agent-comms'
        subprocess.run(['uv', 'lock', '--python', sys.executable,
                        '--upgrade-package', package_name], check=True)
        subprocess.run(['uv', 'sync', '--python', sys.executable,
                        '--locked', '--all-extras', '--no-editable'], check=True)
        package, = (p for p in tomllib.loads(pathlib.Path('uv.lock').read_text())['package']
                    if p['name'] == package_name)
        url, commit = package['source']['git'].split('#')
        repository = url.split('?')[0].removeprefix('https://github.com/').removesuffix('.git')
        print(f'Core resolved from main: {repository}@{commit}')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            print(f'repository={repository}', file=output)
            print(f'commit={commit}', file=output)
        PY
    - uses: actions/checkout@v4
      with:
        repository: ${{ steps.core.outputs.repository }}
        ref: ${{ steps.core.outputs.commit }}
        path: ${{ inputs.path }}
        submodules: recursive
