name: Local-equivalent verification (manual while CI is deferred)
on:
  workflow_dispatch:
    inputs:
      base:
        required: true
        type: string
      head:
        required: true
        type: string
permissions:
  contents: read
jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.12.0
      - run: uv sync --locked
      - name: Compare production source and run guards
        env:
          PR_BASE: ${{ inputs.base }}
          PR_HEAD: ${{ inputs.head }}
        run: |
          uv run --locked agent-comms-ratchet --root src/toad --base "$PR_BASE" --head "$PR_HEAD"
          uv run --locked pytest tests/guards
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.12.0
      - run: uv sync --locked
      - run: uv run --locked pytest -n 2 --basetemp .artifacts/pilots
