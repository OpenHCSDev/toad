name: Local-equivalent verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        required: true
        type: string
      head:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: toad-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  nra-gate:
    name: NRA gate
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.head || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ./.github/actions/core-from-main
        with:
          path: .core-gate
      - name: Install Core's declared checker dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, tomllib
          source = tomllib.loads(pathlib.Path('.core-gate/pyproject.toml').read_text())
          subprocess.run(['uv', 'pip', 'install', '--python', '.venv/bin/python',
                          *source['project']['optional-dependencies']['dev']], check=True)
          PY
      - name: Compare production source
        env:
          # pull_request.base.sha is not refreshed when the base branch moves, so it can name a
          # revision many commits behind and charge the PR for debt main introduced. The PR's own
          # change starts at the merge-base with the base branch's current tip.
          BASE_TIP: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || inputs.base || github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || inputs.head || github.sha }}
        run: PYTHONPATH="$PWD/.core-gate/src" PATH="$PWD/.venv/bin:$PATH" .venv/bin/python .core-gate/tools/nra_client_gate.py --root src/toad --base "$(git merge-base "$BASE_TIP" "$PR_HEAD")" --head "$PR_HEAD"
      - name: Run surface guards
        run: .venv/bin/pytest tests/guards
  suite:
    runs-on: ubuntu-latest
    # A hung test must turn red in minutes, not burn GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ./.github/actions/core-from-main
        with:
          path: .artifacts/core
      - run: uv sync --project .artifacts/core/stack
      # Core's own preparation, with the stock Pi and node it pins.
      - uses: ./.artifacts/core/.github/actions/prepare-native
        with:
          core: .artifacts/core
          python: ${{ github.workspace }}/.artifacts/core/stack/.venv/bin/python
      - name: Qualify the native package from the resolved Core
        run: |
          .venv/bin/python - <<'PYCORE'
          import os
          from pathlib import Path
          from agent_comms.native_package import VerifiedNativePackage
          package, = Path('.artifacts/core/stack').glob('.pi-native-*/node_modules/@earendil-works/pi-coding-agent')
          VerifiedNativePackage.qualify(package.resolve())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'AC_NATIVE_COPIED_PACKAGE={package.resolve()}\n')
          PYCORE
      - name: Prepare the declared Neovim requirement
        run: .venv/bin/python -m toad.neovim_runtime
      # xdist reports a collection error as a worker crash; collect alone first so it reads as one.
      - run: .venv/bin/pytest --collect-only -q
      # A test stuck past 120 s dumps every thread, so the red names where it hung.
      - run: .venv/bin/pytest -n auto --basetemp .artifacts/pilots -o faulthandler_timeout=120 -rfE -vv --tb=short --durations=40
