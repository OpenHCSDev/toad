name: Local-equivalent verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        required: true
        type: string
      head:
        required: true
        type: string
      stock_pi_version:
        description: Stock Pi version accepted by the pinned core native builder
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: toad-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ratchet:
    name: Debt ratchet
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.12.0
      - run: uv sync --locked --all-extras --no-editable
      - name: Read the declared Core source
        id: core
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          source = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['tool']['uv']['sources']['agent-comms']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('repository=' + source['git'].removeprefix('https://github.com/').removesuffix('.git'), file=output)
              print('revision=' + source['branch'], file=output)
          PY
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.revision }}
          path: .core-ratchet
          submodules: recursive
      - name: Install Core's declared checker dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, tomllib
          source = tomllib.loads(pathlib.Path('.core-ratchet/pyproject.toml').read_text())
          subprocess.run(['uv', 'pip', 'install', '--python', '.venv/bin/python',
                          *source['project']['optional-dependencies']['dev']], check=True)
          PY
      - name: Compare production source
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || inputs.head }}
        run: PYTHONPATH="$PWD/.core-ratchet/src" PATH="$PWD/.venv/bin:$PATH" .venv/bin/python .core-ratchet/tools/debt_ratchet.py --root src/toad --base "$PR_BASE" --head "$PR_HEAD"
      - name: Run surface guards
        run: .venv/bin/pytest tests/guards
  suite:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.12.0
      - run: uv sync --locked --all-extras --no-editable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native package through its declared Core source
        env:
          STOCK_PI_VERSION: ${{ inputs.stock_pi_version }}
        run: |
          python - <<'PYCORE'
          import pathlib, subprocess, tomllib
          source = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['tool']['uv']['sources']['agent-comms']
          subprocess.run(['git', 'clone', '--filter=blob:none', '--no-checkout', source['git'], '.artifacts/core'], check=True)
          subprocess.run(['git', '-C', '.artifacts/core', 'checkout', '--detach', source['branch']], check=True)
          subprocess.run(['git', '-C', '.artifacts/core', 'submodule', 'update', '--init', '--recursive'], check=True)
          PYCORE
          uv sync --locked --project .artifacts/core/stack
          npm install --prefix .artifacts/pi-stock --install-strategy=nested "@earendil-works/pi-coding-agent@$STOCK_PI_VERSION"
          export PI_STOCK_DIR="$PWD/.artifacts/pi-stock/node_modules/@earendil-works/pi-coding-agent"
          .artifacts/core/stack/bin/prepare-pi-native
          .venv/bin/python - <<'PYCORE'
          import os
          from pathlib import Path
          from agent_comms.native_package import verify_native_package
          package, = Path('.artifacts/core/stack').glob('.pi-native-*/node_modules/@earendil-works/pi-coding-agent')
          verify_native_package(package.resolve())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'AC_NATIVE_COPIED_PACKAGE={package.resolve()}\n')
          PYCORE
      - run: .venv/bin/pytest -n 2 --basetemp .artifacts/pilots
