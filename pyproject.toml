[project]
name = "batrachian-toad"
version = "0.6.20"
description = "A unified experience for AI in your terminal."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual[syntax]==8.2.8",
    "click==8.4.0",
    "httpx==0.28.1",
    "platformdirs==4.9.6",
    "rich==15.0.0",
    "typeguard==4.5.2",
    "xdg-base-dirs>=6.0.2",
    "textual-serve==1.1.3",
    "textual-speedups==0.2.1",
    "packaging==26.2",
    "bashlex==0.18",
    "pathspec==1.1.1",
    "notify-py==0.3.43",
    "pyperclip==1.11.0",
    "watchdog==6.0.0",
    "setproctitle==1.3.7",
    "psutil==7.2.2",
    "aiosqlite==0.22.1",
    "textual-diff-view==0.1.5",
    "typing-extensions==4.15.0",
    "format-currency>=0.0.10",
    "agent-comms[acp]",
    "agent-client-protocol==0.12.1",
    "ui-theme",
    "formbridge==0.1.0",
    "objectstate==2.1.1",
]

[tool.uv.workspace]
members = ["toad"]

[tool.uv.sources]
ui-theme = { git = "https://github.com/OpenHCSDev/ui-theme.git", rev = "71d088ec78a0e6c88c1fa725160a2da563170eef" }
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "d5edca116113f77932d3cf5811ceec1a6d1bc6b4" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "e4a9154826dd5f96125a7cf75060af47ce39c544" }
textual-diff-view = { git = "https://github.com/OpenHCSDev/textual-diff-view.git", rev = "8fa7d4d0db993ea3b761c2760ca9b6a56a6251e9" }

# formbridge and objectstate declare the dependencies of formbridge's bridge
# server and of objectstate's code generation and history files. The settings
# form imports none of them (formbridge issue #2, ObjectState issue #43), so
# the lock states what the form imports and nothing else.
[[tool.uv.dependency-metadata]]
name = "formbridge"
version = "0.1.0"
requires-dist = ["metaclass-registry>=0.1.5", "objectstate>=2.0,<3", "python-introspect>=0.2.7,<0.3"]

[[tool.uv.dependency-metadata]]
name = "objectstate"
version = "2.1.1"
requires-dist = ["python-introspect>=0.2.0,<0.3"]

[project.scripts]
toad = "toad.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toad"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "mypy>=1.19.1",
    "pyinstrument>=5.1.1",
    "pyte>=0.8.2",
    "pillow>=12",
    "python-xlib>=0.33",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = ["refactor_guard: permanent architecture deletion guards"]
