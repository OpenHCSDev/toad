[project]
name = "batrachian-toad"
version = "0.6.20"
description = "A unified experience for AI in your terminal."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "textual[syntax]",
    "click==8.4.0",
    "httpx==0.28.1",
    "platformdirs==4.9.6",
    "rich==15.0.0",
    "typeguard==4.5.2",
    "xdg-base-dirs>=6.0.2",
    "textual-serve==1.1.3",
    "textual-speedups==0.2.1",
    "textual-image[textual]",
    "packaging==26.2",
    "bashlex==0.18",
    "pathspec==1.1.1",
    "notify-py==0.3.43",
    "jeepney==0.9.0; sys_platform == 'linux'",
    "pyperclip==1.11.0",
    "watchdog==6.0.0",
    "setproctitle==1.3.7",
    "psutil==7.2.2",
    "textual-diff-view",
    "typing-extensions>=4.15.0",
    "format-currency>=0.0.10",
    "agent-comms",
    "metaclass-registry @ git+https://github.com/OpenHCSDev/metaclass-registry@main",
    "agent-client-protocol==0.12.1",
    "ui-theme",
    "formbridge",
    "objectstate",
    "msgpack==1.2.2",
    # The Qt backend (toad.qt) ships with every install: desktop and Android, one source.
    "pyside6-essentials==6.12.0",
    "qasync==0.28.0",
    "pyqt-reactive",
]

[tool.uv.workspace]
members = ["toad"]

[tool.uv.sources]
ui-theme = { git = "https://github.com/OpenHCSDev/ui-theme.git", branch = "main" }
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", branch = "main" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", branch = "main" }
formbridge = { git = "https://github.com/OpenHCSDev/formbridge.git", branch = "main" }
pyqt-reactive = { git = "https://github.com/OpenHCSDev/PyQT-reactive.git", branch = "main" }
textual-image = { git = "https://github.com/OpenHCSDev/textual-image.git", branch = "main" }
textual-diff-view = { git = "https://github.com/OpenHCSDev/textual-diff-view.git", branch = "main" }
objectstate = { git = "https://github.com/OpenHCSDev/objectstate.git", branch = "main" }

[project.scripts]
toad = "toad.cli:main"

[project.entry-points."agent_comms.installer.runtime_preparation"]
neovim = "toad.neovim_runtime:Neovim"

[project.entry-points."agent_comms.writer_owned_stores"]
toad = "toad.client.db"
preferences = "toad.preferences"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Permit direct git refs in project.dependencies (as agent-comms does), so the
# OpenHCSDev forks are declared the one inline way the rest of the fleet uses.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/toad"]

[project.optional-dependencies]
# Pinning the installer's `uv` the way agent-comms does, so the shared install path
# reads a `uv==X.Y.Z` requirement off this package's dev extra when it resolves Toad.
dev = [
    "uv==0.13.1",
]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "mypy>=1.19.1",
    "pyinstrument>=5.1.1",
    "pyte>=0.8.2",
    "pillow>=12",
    "python-xlib>=0.33",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = ["refactor_guard: permanent architecture deletion guards"]

[tool.mypy]
follow_untyped_imports = true
mypy_path = ["src", "."]

[tool.ruff.lint]
extend-select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.nominal-refactor-advisor]
forbidden-imports = [
    { from = "toad.qt", to = ["textual.app", "textual.widgets", "textual.screen", "textual.containers", "toad.widgets", "toad.screens", "toad.app"] },
    { from = "toad.client", to = ["textual", "toad.widgets", "toad.screens", "toad.app"] },
    { from = "toad.widget_actions", to = ["textual.app", "textual.widgets", "textual.screen", "textual.containers", "toad.widgets", "toad.screens", "toad.app"] },
    { from = "toad.shell_output", to = ["textual.app", "textual.widgets", "textual.screen", "textual.containers", "toad.widgets", "toad.screens", "toad.app"] },
]
