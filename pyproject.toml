[project]
name = "batrachian-toad"
version = "0.6.20"
description = "A unified experience for AI in your terminal."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual[syntax]",
    "click==8.4.0",
    "httpx==0.28.1",
    "platformdirs==4.9.6",
    "rich==15.0.0",
    "typeguard==4.5.2",
    "xdg-base-dirs>=6.0.2",
    "textual-serve==1.1.3",
    "textual-speedups==0.2.1",
    "textual-image[textual]",
    "packaging==26.2",
    "bashlex==0.18",
    "pathspec==1.1.1",
    "notify-py==0.3.43",
    "pyperclip==1.11.0",
    "watchdog==6.0.0",
    "setproctitle==1.3.7",
    "psutil==7.2.2",
    "aiosqlite==0.22.1",
    "textual-diff-view",
    "typing-extensions==4.15.0",
    "format-currency>=0.0.10",
    "agent-comms",
    "agent-client-protocol==0.12.1",
    "ui-theme",
    "formbridge",
    "objectstate",
]

[tool.uv.workspace]
members = ["toad"]

[tool.uv.sources]
ui-theme = { git = "https://github.com/OpenHCSDev/ui-theme.git", branch = "main" }
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "67d309df6311aec0d3d173290d941dfced7cf4f0" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", branch = "main" }
formbridge = { git = "https://github.com/OpenHCSDev/formbridge.git", branch = "main" }
objectstate = { git = "https://github.com/OpenHCSDev/objectstate.git", branch = "main" }
textual-image = { git = "https://github.com/OpenHCSDev/textual-image.git", branch = "main" }
textual-diff-view = { git = "https://github.com/OpenHCSDev/textual-diff-view.git", branch = "main" }

[project.scripts]
toad = "toad.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toad"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "mypy>=1.19.1",
    "pyinstrument>=5.1.1",
    "pyte>=0.8.2",
    "pillow>=12",
    "python-xlib>=0.33",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = ["refactor_guard: permanent architecture deletion guards"]
