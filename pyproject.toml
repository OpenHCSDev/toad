[project]
name = "batrachian-toad"
version = "0.6.20"
description = "A unified experience for AI in your terminal."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual[syntax]==8.2.8",
    "click==8.4.0",
    "httpx==0.28.1",
    "platformdirs==4.9.6",
    "rich==15.0.0",
    "typeguard==4.5.2",
    "xdg-base-dirs>=6.0.2",
    "textual-serve==1.1.3",
    "textual-speedups==0.2.1",
    "textual-image[textual]==0.14.1",
    "packaging==26.2",
    "bashlex==0.18",
    "pathspec==1.1.1",
    "notify-py==0.3.43",
    "pyperclip==1.11.0",
    "watchdog==6.0.0",
    "setproctitle==1.3.7",
    "psutil==7.2.2",
    "aiosqlite==0.22.1",
    "textual-diff-view==0.1.5",
    "typing-extensions==4.15.0",
    "format-currency>=0.0.10",
    "agent-comms[acp]",
    "agent-client-protocol==0.12.1",
    "ui-theme",
    "formbridge==0.1.5",
    "objectstate==4.0.1",
]

[tool.uv.workspace]
members = ["toad"]

[tool.uv.sources]
ui-theme = { git = "https://github.com/OpenHCSDev/ui-theme.git", rev = "bbd3b1710c08911beacc2d1666669456a7682658" }
agent-comms = { git = "https://github.com/OpenHCSDev/agent-comms.git", rev = "0800ff1cae4585a359eec6268c6ce809a3af6b7f" }
textual = { git = "https://github.com/OpenHCSDev/textual.git", rev = "3d881d5b2fbad1fed8c4364c478b292c25369079" }
objectstate = { git = "https://github.com/OpenHCSDev/ObjectState.git", rev = "973aa09887b54929825a4f848f69c25c15630464" }
formbridge = { git = "https://github.com/OpenHCSDev/formbridge.git", rev = "3478efcd549fc59867a8b4d195a18f1662ab2eb1" }
textual-diff-view = { git = "https://github.com/OpenHCSDev/textual-diff-view.git", rev = "8fa7d4d0db993ea3b761c2760ca9b6a56a6251e9" }

[project.scripts]
toad = "toad.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toad"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "mypy>=1.19.1",
    "pyinstrument>=5.1.1",
    "pyte>=0.8.2",
    "pillow>=12",
    "python-xlib>=0.33",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = ["refactor_guard: permanent architecture deletion guards"]
