# Tests that fail because the product is wrong and the fix has an owner.
#
# The runner expects each listed test to fail. One that passes is reported as an
# error until its entry is removed, so this list cannot go stale. Add an entry
# only with a named defect, an owner and the reproducer (the test itself).
# `intermittent = true` marks a defect that shows only on some runs: passing is then not an error.

[agent-text-click]
defect = "File paths in line-drawn agent text are plain text, and a written Markdown link keeps the address it was written with: no link for a bare project path, no file search by name, no toad-file address, no copy-path menu. The project-path grammar is not carried over to the line renderer yet; docs/agents/DECISIONS.md lists it under features to carry over. (A written Markdown link does highlight under the pointer and open on click: tests/textual/test_acp_log_link.py, test_clicking_a_file_link_opens_its_preview_tab.)"
owner = "frame-time / line-view owner (perf/line-history)"
tests = [
    "tests/textual/test_file_links_in_agent_text.py::test_existing_project_paths_in_agent_text_are_links_and_other_text_is_not",
    "tests/textual/test_file_links_in_agent_text.py::test_explicit_links_name_the_file_search_or_the_website",
    "tests/textual/test_file_links_in_agent_text.py::test_right_clicking_a_file_link_offers_to_copy_its_full_path",
    "tests/textual/test_file_links_in_agent_text.py::test_a_bare_file_name_links_to_a_search_that_opens_the_one_matching_file",
    "tests/textual/test_file_links_in_agent_text.py::test_a_bare_file_name_found_in_several_places_says_so_instead_of_guessing",
    "tests/app/test_markdown_file_links.py::test_file_link_in_answer_opens_preview_and_return_keeps_draft",
]

[shared-channel-tab]
defect = "A channel has one tab for all sessions (deliberate). When a second session opens a channel the first already has open, the tab still sends as the first session's thread, Back returns to the first session, and closing the first session closes the tab (leaving the store screen). The old per-session expectations were written before tabs were shared. Needs a product decision on what a shared tab does for the second session; the three tests state the proposed answer."
owner = "Tristan (product meaning), then the comms UI owner"
tests = [
    "tests/app/test_channel_tab_sharing.py::test_going_back_from_a_shared_channel_tab_returns_to_the_session_it_was_opened_from",
    "tests/app/test_channel_tab_sharing.py::test_a_shared_channel_tab_sends_as_the_session_it_was_opened_from",
    "tests/app/test_channel_tab_sharing.py::test_closing_one_session_keeps_the_channel_tab_another_session_opened",
]

[key-burst-order]
defect = "Typing while the history has focus: the first printable key moves focus to the editor, but a non-printable key that arrives before the focus change lands is handled by the history window instead. 'x', Left, 'y' sent in one burst gives 'xy', not 'yx' (Conversation.on_key forwards only printable keys)."
owner = "unassigned: Toad input handling (widgets/conversation.py is being edited by the frame-time agent)"
tests = [
    "tests/textual/test_key_bursts_move_focus_to_the_editor.py::test_a_character_a_left_arrow_and_a_character_in_one_burst_keep_their_order",
]

[command-hint-refresh]
defect = "When an agent advertises a command again with a different input hint, the editor keeps showing the first hint after '/command '."
owner = "unassigned: Toad prompt (widgets/prompt.py, slash completion)"
tests = [
    "tests/textual/test_prompt_completion.py::test_a_whole_command_is_selected_backwards_and_the_agents_hint_refreshes",
]


[model-picker-highlight]
defect = "In the model picker the highlighted row is drawn with the same background as its neighbour, and moving the pointer over another row does not move the highlight."
owner = "theming owner (the ui-theme colours work), widgets/model_switcher.py"
tests = [
    "tests/textual/test_model_picker.py::test_hover_and_arrow_keys_move_the_highlight_without_taking_focus_from_search",
    "tests/textual/test_model_picker.py::test_opening_the_picker_focuses_search_and_lists_recent_models_first",
]

[tool-diff-after-modal]
defect = "A tool call that expanded itself and was mounted while a modal screen covered the conversation sometimes never shows its diff after the modal closes (about one run in three under load): its output is not prepared again when it becomes visible."
owner = "unassigned: Toad tool output (tool_output.py, widgets/tool_call.py)"
intermittent = true
tests = [
    "tests/textual/test_tool_diff_lifecycle.py::test_remounting_an_auto_expanded_tool_while_hidden_registers_its_output_again",
]

[late-goal-notice]
defect = "A goal notice that arrives after a newer goal state is shown replaces it: GoalObservation.receive (toad/session_observation.py) publishes every GoalChangedUpdate as the current goal, so a notice of revision 2 delivered after the view read revision 3 puts revision 2 back on the goal bar until the next notice, and a notice delivered after a clear brings the cleared goal back. Core's GoalSnapshot carries no order a view could compare (a cleared goal has no revision), so Core should answer which of two snapshots is newer and Toad should ask before publishing."
owner = "Core goal owner (agent_comms GoalSnapshot), then the Toad goal bar (GoalObservation.receive)"
tests = [
    "tests/native/test_native_goal_objective_edit.py::test_a_late_notice_of_an_older_goal_does_not_replace_the_current_one",
]

[late-answer-drawn-twice]
defect = "A live answer that is applied after its session file and the end of its turn have arrived is sometimes drawn twice and stays that way (about one run in seven for the queued snapshot, less often for a direct snapshot): the saved history is mounted a second time below the first, so the whole history, not only the answer, appears twice."
owner = "frame-time / line-view owner (perf/line-history), transcript_publication.py"
intermittent = true
tests = [
    "tests/textual/test_late_live_answer.py::test_late_live_answer_is_drawn_once[queued-snapshot]",
]


[select-mounted-before-its-label]
defect = "Opening the permission screen sometimes exits Toad with NoMatches: No nodes match '#label' on SelectCurrent. Textual's Select sets its first value in its own mount handler (widgets/_select.py, _init_selected_option), and the SelectCurrent child is present but has not composed its label yet. Seen once in three full runs of the suite."
owner = "Textual fork owner (OpenHCSDev/textual, widgets/_select.py); reached from toad/screens/permissions.py"
intermittent = true
tests = [
    "tests/native/test_native_client_requests.py::test_client_requests_follow_the_session_they_belong_to",
]
